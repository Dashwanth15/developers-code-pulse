global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "dcp-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["dcp-api:8000"]
        labels:
          service: "dcp-backend"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
